name: Generate Sunset City

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run city script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sunset_city.py

      - name: Commit and push to main
        run: |
          git config --global user.name "Eshaan0110"
          git config --global user.email "147876565+Eshaan0110@users.noreply.github.com"

          git add dist/sunset.svg
          git commit -m "chore(city): refresh sunset skyline for $(date -u +%F) [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main

      - name: Purge jsdelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/Eshaan0110/Eshaan0110@main/dist/sunset.svg"
          echo "Cache purged"
